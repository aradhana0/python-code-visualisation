# Companies whose OFFICIAL career pages are scanned. Each entry points at the public
# job-board API behind the company's own careers site (never an aggregator).
#
# This is a STARTER list: board slugs were written from memory and could not be verified
# from the environment that generated them. Run `python -m job_tracker check-sources`
# first; fix or disable (enabled = false) anything reported as FAIL.
#
# How to find a slug: open the company's careers page and look at the apply links:
#   boards.greenhouse.io/<slug> or job-boards.greenhouse.io/<slug>   -> ats = "greenhouse"
#   jobs.lever.co/<slug> (jobs.eu.lever.co -> region = "eu")          -> ats = "lever"
#   jobs.ashbyhq.com/<slug>                                           -> ats = "ashby"
#   jobs.smartrecruiters.com/<slug>                                   -> ats = "smartrecruiters"
#   <host>/en-US/<site>  where host ends in myworkdayjobs.com         -> ats = "workday"
#       tenant = first label of host (e.g. "salesforce"), site = path segment after locale

